<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王淇 · WANG QI — 智能装备制造技术</title>
<meta name="description" content="王淇的个人简历主页 · 山东城市服务职业学院 · 智能装备制造技术专业">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23123A5C'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23E8A33D' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23E8A33D'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#EFF2F5;
    --bg-alt:#E4E9EE;
    --surface:#FFFFFF;
    --ink:#16232E;
    --ink-soft:#4B5C6E;
    --ink-faint:#7C8B9B;
    --line:#CBD5DE;
    --line-strong:#A9B8C4;
    --blue:#2F6FA6;
    --blue-deep:#123A5C;
    --amber:#D98A1F;
    --amber-soft:#F1C888;
    --green:#3F7A5F;
    --radius:14px;
    --radius-sm:8px;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, "Liberation Mono", "PingFang SC", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --shadow-sm: 0 1px 2px rgba(18,58,92,.06), 0 1px 1px rgba(18,58,92,.04);
    --shadow-md: 0 8px 24px rgba(18,58,92,.10), 0 2px 6px rgba(18,58,92,.06);
    --dur:200ms;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  html[data-theme="dark"]{
    --bg:#0D1A25;
    --bg-alt:#0A141D;
    --surface:#132434;
    --ink:#E7EDF2;
    --ink-soft:#A7B8C7;
    --ink-faint:#748699;
    --line:#233B4D;
    --line-strong:#33526A;
    --blue:#6BA6DA;
    --blue-deep:#9CC7EE;
    --amber:#E8AE4E;
    --amber-soft:#8A6321;
    --green:#7FBFA0;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  /* ===== Water canvas background ===== */
  #waterCanvas{
    position:fixed; inset:0; z-index:0;
    width:100%; height:100%;
    display:block;
  }
  /* ===== Cursor aura (hides default cursor, shows halo) ===== */
  html, body{
    cursor: none;
  }
  a, button, .cert-card, .tab, .hcard, .chip, .edu-card, .icon-btn, .btn{
    cursor: none;
  }
  #cursorAura{
    position:fixed; top:0; left:0; z-index:9999;
    width:44px; height:44px; margin:-22px 0 0 -22px;
    border-radius:50%;
    border:1.5px solid var(--blue);
    pointer-events:none;
    mix-blend-mode: multiply;
    background: radial-gradient(circle, rgba(47,111,166,.10) 0%, rgba(47,111,166,.04) 40%, transparent 70%);
    box-shadow:
      0 0 0 1px rgba(47,111,166,.18),
      0 0 18px rgba(47,111,166,.22),
      inset 0 0 8px rgba(47,111,166,.20);
    transition: width .18s var(--ease), height .18s var(--ease), margin .18s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
    will-change: transform;
  }
  #cursorAura::after{
    content:""; position:absolute; left:50%; top:50%;
    width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%; background:var(--amber);
    box-shadow:0 0 8px var(--amber);
  }
  html[data-theme="dark"] #cursorAura{
    mix-blend-mode: screen;
    border-color: var(--blue-deep);
    background: radial-gradient(circle, rgba(156,199,238,.14) 0%, rgba(156,199,238,.05) 40%, transparent 70%);
    box-shadow:
      0 0 0 1px rgba(156,199,238,.25),
      0 0 22px rgba(107,166,218,.28),
      inset 0 0 10px rgba(156,199,238,.25);
  }
  #cursorAura.hover{
    width:64px; height:64px; margin:-32px 0 0 -32px;
    border-color: var(--amber);
  }
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background: var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
    position:relative;
    overflow-x:hidden;
  }
  /* Content layers above water */
  #navbar, main, footer, #toTop, #toast, #mobileNav, .lightbox{ z-index:5; position:relative; }
  #navbar{ z-index:50; }
  #mobileNav{ z-index:49; }
  .lightbox{ z-index:80; }
  #toTop{ z-index:40; }
  #toast{ z-index:60; }
  ::selection{ background:var(--amber-soft); color:var(--blue-deep); }
  a{ color:var(--blue); }
  h1,h2,h3{ margin:0; font-family:var(--sans); }
  p{ margin:0; }
  button{ font-family:var(--sans); cursor:pointer; }
  .wrap{ max-width:960px; margin:0 auto; padding:0 24px; }

  /* ---------- NAV ---------- */
  #navbar{
    position:sticky; top:0; z-index:50;
    backdrop-filter:saturate(160%) blur(10px);
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:960px; margin:0 auto; padding:0 24px;
    height:60px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .nav-id{ display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.02em; white-space:nowrap; }
  .nav-id .chip{
    width:26px; height:26px; border-radius:7px;
    background:linear-gradient(155deg, var(--blue-deep), var(--blue));
    position:relative; flex:none;
  }
  .nav-id .chip::after{
    content:""; position:absolute; inset:6px; border:1.4px solid rgba(255,255,255,.7); border-radius:3px;
  }
  .nav-links{ display:flex; align-items:center; gap:22px; list-style:none; margin:0; padding:0; }
  .nav-links a{
    text-decoration:none; color:var(--ink-soft); font-size:14px; position:relative; padding:4px 0;
    transition:color var(--dur) var(--ease);
  }
  .nav-links a::after{
    content:""; position:absolute; left:0; right:100%; bottom:-2px; height:2px; background:var(--amber);
    transition:right var(--dur) var(--ease);
  }
  .nav-links a:hover{ color:var(--ink); }
  .nav-links a:hover::after{ right:0; }
  .nav-actions{ display:flex; align-items:center; gap:8px; }
  .icon-btn{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
    transition:transform var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .icon-btn:hover{ color:var(--blue-deep); border-color:var(--line-strong); transform:translateY(-1px); }
  .icon-btn svg{ width:16px; height:16px; }
  #navToggle{ display:none; }
  @media (max-width:700px){
    .nav-links{ display:none; }
    #navToggle{ display:flex; }
  }

  /* ---------- MOBILE NAV DRAWER ---------- */
  #mobileNav{
    position:fixed; inset:60px 0 auto 0; z-index:49; background:var(--surface);
    border-bottom:1px solid var(--line); box-shadow:var(--shadow-md);
    max-height:0; overflow:hidden; transition:max-height var(--dur) var(--ease);
  }
  #mobileNav.open{ max-height:320px; }
  #mobileNav ul{ list-style:none; margin:0; padding:10px 24px 18px; display:flex; flex-direction:column; gap:2px; }
  #mobileNav a{ text-decoration:none; color:var(--ink); padding:10px 4px; font-size:15px; border-bottom:1px solid var(--line); }

  /* ---------- SECTION FRAME ---------- */
  main{ padding-top:8px; }
  .section{ padding:56px 0 8px; opacity:0; transform:translateY(14px); transition:opacity .5s var(--ease), transform .5s var(--ease); }
  .section.in{ opacity:1; transform:none; }

  /* ---------- OPENING ANIMATION (page load) ---------- */
  @keyframes navDrop{ from{ transform:translateY(-100%); } to{ transform:none; } }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(26px); filter:blur(6px); }
    to{ opacity:1; transform:none; filter:none; }
  }
  @keyframes plateIn{
    from{ opacity:0; transform:translateX(52px) rotate(1.6deg); }
    to{ opacity:1; transform:none; }
  }
  #navbar{ animation:navDrop .55s var(--ease) both; }
  .hero-name{ animation:riseIn .65s .12s var(--ease) both; }
  .hero-role{ animation:riseIn .65s .24s var(--ease) both; }
  .hero-intro{ animation:riseIn .65s .36s var(--ease) both; }
  .hero-badges{ animation:riseIn .65s .48s var(--ease) both; }
  .hero-actions{ animation:riseIn .65s .6s var(--ease) both; }
  .plate{ animation:plateIn .75s .3s var(--ease) both; }

  /* ---------- SCROLL STAGGER (cards cascade in when section enters viewport) ---------- */
  .section .hcard, .section .cert-card, .section .skill-group, .section .edu-card, .section .titem, .section .proj-card{
    opacity:0; translate:0 22px; scale:.985;
    transition:
      opacity .6s var(--ease) var(--d,0ms),
      translate .6s var(--ease) var(--d,0ms),
      scale .6s var(--ease) var(--d,0ms),
      transform var(--dur) var(--ease),
      box-shadow var(--dur) var(--ease),
      border-color var(--dur) var(--ease);
  }
  .section.in .hcard, .section.in .cert-card, .section.in .skill-group, .section.in .edu-card, .section.in .titem, .section.in .proj-card{
    opacity:1; translate:0 0; scale:1;
  }
  /* divider underline expands + label fades */
  .section .divider .line{ scale:0 1; transform-origin:left center; transition:scale .8s var(--ease) .12s; }
  .section.in .divider .line{ scale:1 1; }
  .section .divider .label{ opacity:0; translate:0 8px; transition:opacity .5s var(--ease) .1s, translate .5s var(--ease) .1s; }
  .section.in .divider .label{ opacity:1; translate:0 0; }
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--amber);
    text-transform:uppercase; display:inline-block; margin-bottom:8px;
  }
  .divider{ display:flex; align-items:center; gap:12px; margin:0 0 30px; }
  .divider .tick{ width:1px; height:12px; background:var(--line-strong); flex:none; }
  .divider .line{ flex:1; height:1px; background:var(--line); }
  .divider .label{
    font-family:var(--mono); font-size:13px; letter-spacing:.06em; color:var(--ink-soft); white-space:nowrap;
  }

  /* ---------- HERO ---------- */
  #hero{ padding-top:64px; }
  .hero-grid{ display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center; }
  @media (max-width:820px){ .hero-grid{ grid-template-columns:1fr; } }
  .hero-name{ font-size:clamp(40px,6vw,64px); font-weight:800; letter-spacing:-.01em; line-height:1.05; }
  .hero-name .en{
    display:block; font-family:var(--mono); font-size:14px; font-weight:500; letter-spacing:.22em;
    color:var(--ink-faint); margin-top:10px;
  }
  .hero-role{ margin-top:16px; font-size:17px; color:var(--ink-soft); max-width:46ch; }
  .hero-intro{ margin-top:18px; color:var(--ink-soft); max-width:56ch; font-size:15px; }
  .hero-badges{ display:flex; flex-wrap:wrap; gap:8px; margin-top:22px; }
  .hero-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; }

  .badge{
    font-family:var(--mono); font-size:12.5px; letter-spacing:.02em; color:var(--ink-soft);
    background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 12px;
    display:inline-flex; align-items:center; gap:6px;
  }
  .badge::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--amber); flex:none; }

  .btn{
    display:inline-flex; align-items:center; gap:8px; border-radius:9px; padding:10px 16px; font-size:14px;
    font-weight:600; border:1px solid transparent; text-decoration:none; transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn-primary{ background:var(--blue-deep); color:#fff; box-shadow:var(--shadow-sm); }
  .btn-primary:hover{ box-shadow:var(--shadow-md); }
  .btn-ghost{ background:var(--surface); color:var(--ink); border-color:var(--line); }
  .btn-ghost:hover{ border-color:var(--line-strong); }
  .btn svg{ width:15px; height:15px; }

  /* ---------- NAMEPLATE (signature element) ---------- */
  .plate{
    position:relative; background:linear-gradient(160deg, var(--surface), var(--bg-alt));
    border:1px solid var(--line); border-radius:12px; padding:26px 26px 22px;
    box-shadow:var(--shadow-md);
    background-image:
      radial-gradient(circle at 16px 16px, var(--line-strong) 0 2.6px, transparent 3px),
      radial-gradient(circle at calc(100% - 16px) 16px, var(--line-strong) 0 2.6px, transparent 3px),
      radial-gradient(circle at 16px calc(100% - 16px), var(--line-strong) 0 2.6px, transparent 3px),
      radial-gradient(circle at calc(100% - 16px) calc(100% - 16px), var(--line-strong) 0 2.6px, transparent 3px),
      linear-gradient(160deg, var(--surface), var(--bg-alt));
  }
  .plate .plate-eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--ink-faint); text-transform:uppercase; }
  .plate .plate-row{
    display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px dashed var(--line); font-size:13.5px;
  }
  .plate .plate-row:first-of-type{ border-top:none; margin-top:14px; }
  .plate .plate-row dt{ font-family:var(--mono); color:var(--ink-faint); font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; }
  .plate .plate-row dd{ margin:0; color:var(--ink); font-weight:600; text-align:right; }
  .plate dl{ margin:0; }

  /* ---------- HIGHLIGHTS ---------- */
  .grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  @media (max-width:900px){ .grid-4{ grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .grid-4{ grid-template-columns:1fr;} }
  .hcard{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 18px; transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .hcard:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:var(--line-strong); }
  .hcard .tag{ font-family:var(--mono); font-size:11px; color:var(--amber); letter-spacing:.08em; }
  .hcard h3{ font-size:16px; margin:10px 0 6px; }
  .hcard p{ font-size:13.5px; color:var(--ink-soft); }

  /* ---------- TABS ---------- */
  .tablist{ display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:22px; flex-wrap:wrap; }
  .tab{
    background:transparent; border:none; padding:10px 4px; margin-right:18px; font-size:14.5px; font-weight:600;
    color:var(--ink-faint); position:relative; border-bottom:2px solid transparent; top:1px;
    transition:color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .tab[aria-selected="true"]{ color:var(--blue-deep); border-color:var(--amber); }
  html[data-theme="dark"] .tab[aria-selected="true"]{ color:var(--blue-deep); }
  .tab:focus-visible, .icon-btn:focus-visible, .btn:focus-visible, a:focus-visible{
    outline:2px solid var(--amber); outline-offset:2px;
  }
  .panel[hidden]{ display:none; }
  .timeline{ display:flex; flex-direction:column; gap:0; }
  .titem{ display:grid; grid-template-columns:120px 1fr; gap:18px; padding:18px 0; border-top:1px solid var(--line); }
  .titem:first-child{ border-top:none; }
  @media (max-width:600px){ .titem{ grid-template-columns:1fr; gap:6px; } }
  .titem .when{ font-family:var(--mono); font-size:12px; color:var(--ink-faint); letter-spacing:.04em; }
  .titem h3{ font-size:16px; }
  .titem .org{ color:var(--ink-soft); font-size:13.5px; margin-top:2px; }
  .titem ul{ margin:10px 0 0; padding-left:18px; color:var(--ink-soft); font-size:14px; }
  .titem li{ margin:5px 0; }
  .empty-state{
    border:1px dashed var(--line-strong); border-radius:var(--radius); padding:26px; text-align:center;
    color:var(--ink-faint); font-size:14px; font-family:var(--mono);
  }

  /* ---------- CERTIFICATES ---------- */
  .cert-sub{ font-size:13.5px; color:var(--ink-faint); margin:-14px 0 18px; font-family:var(--mono); }
  .cert-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:760px){ .cert-grid{ grid-template-columns:repeat(2,1fr);} }
  @media (max-width:480px){ .cert-grid{ grid-template-columns:1fr;} }
  .cert-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:0; overflow:hidden;
    text-align:left; display:flex; flex-direction:column; transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .cert-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:var(--line-strong); }
  .cert-thumb{ overflow:hidden; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
  .cert-thumb img{ width:100%; height:auto; object-fit:contain; display:block; transition:transform .35s var(--ease); }
  .cert-card:hover .cert-thumb img{ transform:scale(1.04); }
  .cert-info{ padding:12px 14px 14px; }
  .cert-title{ font-size:13.5px; font-weight:700; line-height:1.4; color:var(--ink); }
  .cert-issuer{ font-size:12px; color:var(--ink-faint); margin-top:5px; font-family:var(--mono); }

  .lightbox{
    position:fixed; inset:0; z-index:80; background:rgba(10,18,26,.82);
    display:flex; align-items:center; justify-content:center; padding:28px;
    opacity:0; pointer-events:none; transition:opacity var(--dur) var(--ease);
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lb-stage{ max-width:min(960px,92vw); max-height:88vh; display:flex; flex-direction:column; align-items:center; gap:0; }
  .lb-stage img{ max-width:100%; max-height:72vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.5); background:#fff; }
  .lb-caption{ margin-top:14px; text-align:center; color:#fff; }
  .lb-title{ font-size:14.5px; font-weight:700; }
  .lb-meta{ font-size:12px; color:rgba(255,255,255,.7); margin-top:4px; font-family:var(--mono); }
  .lb-close{
    position:absolute; top:20px; right:20px; width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .lb-close:hover{ background:rgba(255,255,255,.22); }
  .lb-close svg{ width:18px; height:18px; }
  .lb-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .lb-nav:hover{ background:rgba(255,255,255,.22); }
  .lb-nav svg{ width:20px; height:20px; }
  .lb-prev{ left:18px; } .lb-next{ right:18px; }
  @media (max-width:560px){ .lb-nav{ width:38px; height:38px; } .lb-prev{ left:8px; } .lb-next{ right:8px; } }

  /* ---------- SKILLS ---------- */
  .skill-groups{ display:grid; grid-template-columns:repeat(2,1fr); gap:22px 28px; }
  @media (max-width:640px){ .skill-groups{ grid-template-columns:1fr; } }
  .skill-group h3{
    font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:12px;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13.5px;
    display:flex; align-items:center; gap:8px; transition:border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .chip:hover{ border-color:var(--blue); transform:translateY(-1px); }
  .chip i{ width:7px; height:7px; border-radius:2px; background:var(--blue); flex:none; }
  .chip.plan i{ background:var(--ink-faint); }
  .chip.plan{ color:var(--ink-soft); border-style:dashed; }

  /* ---------- EDUCATION ---------- */
  .edu-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:24px;
    display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:start;
  }
  @media (max-width:560px){ .edu-card{ grid-template-columns:1fr; } }
  .edu-mark{
    width:52px; height:52px; border-radius:10px; background:linear-gradient(155deg, var(--blue-deep), var(--blue));
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-family:var(--mono); font-size:13px;
  }
  .edu-card h3{ font-size:17px; }
  .edu-card .when{ font-family:var(--mono); font-size:12px; color:var(--ink-faint); margin-top:2px; display:block; }

  /* ============ WATER RIPPLE BACKGROUND ============ */
  function initWater(){
    var canvas = byId("waterCanvas");
    if(!canvas) return;
    var ctx = canvas.getContext("2d");
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0;
    var cols, rows;          // ripple grid resolution
    var cell = 6;            // cell size in CSS pixels
    var damp = 0.94;         // damping factor (ripple life)
    var cur, prev;           // height buffers
    var off = document.createElement("canvas"); // offscreen buffer (CSS-pixel sized)
    var octx = off.getContext("2d");
    var imgData, pix;
    var bgColors = {
      light:{ r0:239, g0:242, b0:245, r1:212, g1:224, b1:238, ripple:24 },
      dark: { r0:13,  g0:26,  b0:37,  r1:10,  g1:20,  b1:29,  ripple:36 }
    };
    function resize(){
      W = Math.max(1, Math.floor(window.innerWidth));
      H = Math.max(1, Math.floor(window.innerHeight));
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      // main canvas transform maps CSS pixels -> device pixels
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      cols = Math.ceil(W / cell) + 2;
      rows = Math.ceil(H / cell) + 2;
      var n = cols * rows;
      cur = new Float32Array(n);
      prev = new Float32Array(n);
      // offscreen = exactly cols*cell x rows*cell (CSS pixel resolution for ripple drawing)
      off.width  = cols * cell;
      off.height = rows * cell;
      imgData = octx.createImageData(off.width, off.height);
      pix = imgData.data;
    }
    function drop(cx, cy, strength, radius){
      if(!cur) return;
      var gx = Math.floor(cx / cell);
      var gy = Math.floor(cy / cell);
      var r = Math.max(1, Math.floor(radius / cell));
      for(var j = -r; j <= r; j++){
        for(var i = -r; i <= r; i++){
          var d2 = i*i + j*j;
          if(d2 > r*r) continue;
          var x = gx + i, y = gy + j;
          if(x < 1 || y < 1 || x >= cols-1 || y >= rows-1) continue;
          var falloff = 1 - Math.sqrt(d2) / r;
          cur[y * cols + x] += strength * falloff * falloff;
        }
      }
    }
    function isDark(){
      return document.documentElement.getAttribute("data-theme") === "dark";
    }
    function step(){
      var n;
      for(var y = 1; y < rows - 1; y++){
        for(var x = 1; x < cols - 1; x++){
          n = y * cols + x;
          var v = (
            cur[n-1] + cur[n+1] +
            cur[n-cols] + cur[n+cols]
          ) * 0.5 - prev[n];
          prev[n] = v * damp;
        }
      }
      var tmp = cur; cur = prev; prev = tmp;
    }
    function render(){
      var c = isDark() ? bgColors.dark : bgColors.light;
      var rp = c.ripple;
      var w = cols * cell, h = rows * cell;
      var data = pix;
      var idx, nx, ny, v, shade;
      for(var y = 0; y < rows; y++){
        for(var x = 0; x < cols; x++){
          idx = y * cols + x;
          nx = (x>0 && x<cols-1) ? (cur[idx-1] - cur[idx+1]) : 0;
          ny = (y>0 && y<rows-1) ? (cur[idx-cols] - cur[idx+cols]) : 0;
          v = cur[idx];
          shade = y / rows;
          var r = Math.round(c.r0 + (c.r1 - c.r0) * shade + nx*rp + v*rp*0.4);
          var g = Math.round(c.g0 + (c.g1 - c.g0) * shade + ny*rp + v*rp*0.4);
          var b = Math.round(c.b0 + (c.b1 - c.b0) * shade + (nx+ny)*rp*0.5 + v*rp*0.6);
          if(r<0)r=0; if(r>255)r=255;
          if(g<0)g=0; if(g>255)g=255;
          if(b<0)b=0; if(b>255)b=255;
          var py = y * cell, px = x * cell;
          for(var iy = 0; iy < cell; iy++){
            var rowStart = ((py + iy) * w + px) * 4;
            for(var ix = 0; ix < cell; ix++){
              var p = rowStart + ix * 4;
              data[p]   = r;
              data[p+1] = g;
              data[p+2] = b;
              data[p+3] = 255;
            }
          }
        }
      }
      // 1) blit pixel data into offscreen buffer (CSS-pixel size, not affected by DPR)
      octx.putImageData(imgData, 0, 0);
      // 2) clear main canvas, draw offscreen onto main canvas cropped to W x H (CSS pixel space).
      //    ctx already uses DPR transform, so drawing at (0,0) size W x H maps to full viewport.
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(off, 0, 0, W, H, 0, 0, W, H);
      // 3) vignette overlay in CSS pixel coords
      var grad = ctx.createRadialGradient(W*0.5, H*0.55, Math.min(W,H)*0.2, W*0.5, H*0.55, Math.max(W,H)*0.75);
      if(isDark()){
        grad.addColorStop(0, "rgba(0,0,0,0)");
        grad.addColorStop(1, "rgba(0,0,0,0.45)");
      } else {
        grad.addColorStop(0, "rgba(255,255,255,0)");
        grad.addColorStop(1, "rgba(20,40,60,0.12)");
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,W,H);
    }
    function loop(){
      step();
      render();
      requestAnimationFrame(loop);
    }

    // ambient gentle ripples (auto)
    var ambientT = 0;
    function ambientDrop(){
      ambientT++;
      var cx = (Math.sin(ambientT * 0.9) * 0.5 + 0.5) * W;
      var cy = (Math.cos(ambientT * 0.47) * 0.5 + 0.5) * H;
      drop(cx + (Math.random()-.5)*60, cy + (Math.random()-.5)*60, 1.2, 16);
      setTimeout(ambientDrop, 5200 + Math.random()*2800);
    }

    resize();
    window.addEventListener("resize", resize);
    drop(W*0.3, H*0.35, 1.6, 20);
    drop(W*0.7, H*0.55, 1.4, 18);
    drop(W*0.5, H*0.8,  1.5, 20);
    requestAnimationFrame(loop);
    ambientDrop();

    initWater._drop = drop;
  }

  /* ============ CURSOR AURA + MOUSE RIPPLE TRIGGER ============ */
  function initCursor(){
    var aura = byId("cursorAura");
    if(!aura) return;
    var targetX = window.innerWidth * 0.5, targetY = window.innerHeight * 0.5;
    var curX = targetX, curY = targetY;
    var lastDrop = 0;
    var lastMoveX = targetX, lastMoveY = targetY;
    window.addEventListener("mousemove", function(e){
      targetX = e.clientX; targetY = e.clientY;
      // ripple on mouse movement — drop every ~110px of travel or every 240ms (sparse, calm)
      var now = performance.now();
      var dx = targetX - lastMoveX, dy = targetY - lastMoveY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if(now - lastDrop > 240 || dist > 110){
        if(initWater._drop){
          var strength = Math.min(2.0, 1.0 + dist * 0.008);
          initWater._drop(targetX, targetY, strength, 20);
        }
        lastDrop = now;
        lastMoveX = targetX; lastMoveY = targetY;
      }
    }, {passive:true});
    window.addEventListener("mousedown", function(e){
      if(initWater._drop) initWater._drop(e.clientX, e.clientY, 3.2, 28);
      aura.classList.add("hover");
      setTimeout(function(){ aura.classList.remove("hover"); }, 180);
    });
    // hover state for interactive elements
    document.addEventListener("mouseover", function(e){
      var t = e.target;
      if(t && t.closest && (t.closest("a") || t.closest("button") || t.closest(".cert-card") || t.closest(".tab") || t.closest(".hcard") || t.closest(".chip") || t.closest(".edu-card") || t.closest(".icon-btn") || t.closest(".btn"))){
        aura.classList.add("hover");
      }
    });
    document.addEventListener("mouseout", function(e){
      var t = e.target;
      if(t && t.closest && (t.closest("a") || t.closest("button") || t.closest(".cert-card") || t.closest(".tab") || t.closest(".hcard") || t.closest(".chip") || t.closest(".edu-card") || t.closest(".icon-btn") || t.closest(".btn"))){
        aura.classList.remove("hover");
      }
    });
    // smooth follow
    function tick(){
      curX += (targetX - curX) * 0.22;
      curY += (targetY - curY) * 0.22;
      aura.style.transform = "translate3d(" + curX.toFixed(2) + "px," + curY.toFixed(2) + "px,0)";
      requestAnimationFrame(tick);
    }
    tick();
    // hide when cursor leaves window
    document.addEventListener("mouseleave", function(){ aura.style.opacity = "0"; });
    document.addEventListener("mouseenter", function(){ aura.style.opacity = "1"; });
    // touch screens: hide aura and restore default cursor
    if("ontouchstart" in window){
      document.documentElement.style.cursor = "";
      document.body.style.cursor = "";
      aura.style.display = "none";
    }
  }
